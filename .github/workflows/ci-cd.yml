name: VillageShop SaaS CI/CD Pipeline

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore VillageShop.sln

    - name: Build
      run: dotnet build VillageShop.sln --no-restore -c Release

    - name: Test
      run: dotnet test VillageShop.sln --no-build -c Release --verbosity normal

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t villageshop-api:${{ github.sha }} .
